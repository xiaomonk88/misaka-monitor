name: Docker 镜像

# 打版本标签（v1.2.3）→ 构建并发布 1.2.3 / 1.2 / latest
# 推送 main      → 构建并发布 edge（开发版，不影响 latest）
# Pull Request   → 只构建与冒烟测试，不发布
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('app/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "::error::标签 ${GITHUB_REF#refs/tags/} 与 app/__init__.py 中的版本 $VERSION 不一致"; exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 冒烟测试镜像（amd64）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: misaka-monitor:test
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动容器并检查 /healthz
        run: |
          docker run -d --name smoke -p 8000:8000 -e APP_SECRET_KEY=ci-smoke misaka-monitor:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"version":"${{ steps.ver.outputs.version }}"'
          curl -fsS -o /dev/null -w "login %{http_code}\n" http://127.0.0.1:8000/login
          docker logs smoke | tail -20

      - name: 登录 ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 构建并发布（amd64 + arm64）
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
